name: facility_camera
description: 시설기사 안전카메라 - 카메라 모듈 테스트 앱
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  google_mlkit_object_detection: ^0.15.0
  path_provider: ^2.1.4
  http: ^1.6.0
  flutter_image_compress: ^2.5.1
  sensors_plus: ^7.1.1
  wakelock_plus: ^1.7.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/test_frames/
